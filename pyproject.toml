# Description du projet Python : nom, version de Python, dépendances.
# `uv sync` lit ce fichier, crée l'environnement virtuel (.venv) et installe tout.
[project]
name = "factures"
version = "0.1.0"
description = "De la facture scannée à l'agent IA : OCR, bronze/silver, DuckDB, MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",          # client S3 (fonctionne avec tout stockage compatible S3, dont Hyperfluid)
    "python-dotenv>=1.0",   # charge le fichier .env dans les variables d'environnement
    "pypdf>=5.0",           # lecture des PDF : extraction de la couche texte
]

# Crée la commande `factures` (utilisable via `uv run factures ...`)
[project.scripts]
factures = "factures.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factures"]
